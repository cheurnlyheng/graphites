spring:
  application:
    name: shop
  datasource:
    url: jdbc:postgresql://localhost:5432/jess
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-generation
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-placeholder-change-me}
    expiration-minutes: 60
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  warehouse:
    name: ${WAREHOUSE_NAME:Jess's Shop}
    street1: ${WAREHOUSE_STREET1:}
    city: ${WAREHOUSE_CITY:}
    state: ${WAREHOUSE_STATE:}
    zip: ${WAREHOUSE_ZIP:}
    country: ${WAREHOUSE_COUNTRY:US}
    phone: ${WAREHOUSE_PHONE:}
    email: ${WAREHOUSE_EMAIL:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

shippo:
  api-token: ${SHIPPO_API_TOKEN:}
  base-url: https://api.goshippo.com

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
