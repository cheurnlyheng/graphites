spring:
  application:
    name: shop
  datasource:
    url: jdbc:postgresql://localhost:5432/jess
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-generation
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB     # hero banners are big photos; Spring's default of 1MB would reject them
      max-request-size: 10MB

server:
  port: 8080

# The full API schema (every endpoint, every request/response shape, including admin routes) was
# being served publicly at /swagger-ui and /v3/api-docs -- free reconnaissance for an attacker, and
# nothing in this project's own workflow actually uses it (everything's been verified with curl
# directly). Disabled outright rather than left running and gated behind auth, since a browser can't
# attach a Bearer token to a plain page navigation anyway.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    # No fallback on purpose: a guessable default here would quietly sign real admin tokens with a
    # publicly-known key if JWT_SECRET is ever left unset in a real deployment. Fail loud instead.
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:uploads}   # admin-uploaded images; relative to where the backend is started
  warehouse:
    name: ${WAREHOUSE_NAME:GRAPHITES}
    street1: ${WAREHOUSE_STREET1:}
    city: ${WAREHOUSE_CITY:}
    state: ${WAREHOUSE_STATE:}
    zip: ${WAREHOUSE_ZIP:}
    country: ${WAREHOUSE_COUNTRY:US}
    phone: ${WAREHOUSE_PHONE:}
    email: ${WAREHOUSE_EMAIL:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

shippo:
  api-token: ${SHIPPO_API_TOKEN:}
  base-url: https://api.goshippo.com
  # Shippo's tracking webhook has no built-in signature scheme on a standard account, so this shared
  # secret is appended as a query param on the webhook URL registered in the Shippo dashboard
  # (.../api/webhooks/shippo?token=...) and checked on the way in. Left blank, the endpoint accepts
  # any request -- fine for local testing, not for a real deployment.
  webhook-token: ${SHIPPO_WEBHOOK_TOKEN:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

sentry:
  # Blank dsn makes the Sentry SDK a no-op (confirmed by its own auto-configuration) -- safe to leave
  # unset locally; only reports errors once a real Sentry project's DSN is set in production.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  # Every unhandled exception is already rare and worth seeing in full; no need to sample them down.
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
